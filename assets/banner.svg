<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="55%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- circuit lines -->
  <g stroke="#1e3a5f" stroke-width="2" fill="none" opacity="0.6">
    <path d="M760 0 L760 60 L830 60 L830 110 L900 110"/>
    <path d="M900 0 L900 40 L960 40 L960 90"/>
    <path d="M1000 20 L1000 80 L1080 80 L1080 140"/>
    <path d="M840 360 L840 300 L920 300 L920 250"/>
    <path d="M700 360 L700 310 L760 310 L760 260"/>
    <path d="M1140 200 L1060 200 L1060 260 L1000 260"/>
  </g>
  <g fill="#22d3ee" opacity="0.85">
    <circle cx="830" cy="110" r="4"/>
    <circle cx="960" cy="90" r="4"/>
    <circle cx="1080" cy="140" r="4"/>
    <circle cx="920" cy="250" r="4"/>
    <circle cx="760" cy="260" r="4"/>
    <circle cx="1000" cy="260" r="4"/>
  </g>

  <!-- boost gauge -->
  <g transform="translate(1000,190)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#132a4a" stroke-width="14"/>
    <path d="M -95 55 A 120 120 0 1 1 95 55" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="70" fill="#0a1128" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="45" y2="-55" stroke="url(#needleGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#a3e635"/>
    <circle cx="0" cy="-50" r="55" fill="url(#dotGlow)" opacity="0.4"/>
  </g>

  <!-- upward boost chevrons -->
  <g stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <polyline points="860,300 895,260 930,300"/>
    <polyline points="860,320 895,280 930,320" opacity="0.5"/>
  </g>

  <!-- faint driver icon suggestion: layered chip -->
  <g opacity="0.5">
    <rect x="70" y="270" width="70" height="46" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="85" y1="270" x2="85" y2="255" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="270" x2="105" y2="255" stroke="#38bdf8" stroke-width="2"/>
    <line x1="125" y1="270" x2="125" y2="255" stroke="#38bdf8" stroke-width="2"/>
    <line x1="85" y1="316" x2="85" y2="331" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="316" x2="105" y2="331" stroke="#38bdf8" stroke-width="2"/>
    <line x1="125" y1="316" x2="125" y2="331" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#f4f9ff">
    <tspan x="60" dy="0" font-size="64" textLength="560" lengthAdjust="spacingAndGlyphs">Driver Booster Pro</tspan>
    <tspan x="60" dy="72" font-size="64" textLength="720" lengthAdjust="spacingAndGlyphs">Full Version Download</tspan>
  </text>

  <text x="60" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#9fd8f0" textLength="720" lengthAdjust="spacingAndGlyphs">Streamlines driver updates and management for the Windows ecosystem</text>

  <line x1="60" y1="180" x2="60" y2="20" stroke="url(#accent)" stroke-width="0" opacity="0"/>
</svg>